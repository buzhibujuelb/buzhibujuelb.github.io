<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Wall</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="top-bar">
  <a href="/index.html" class="icon-button" title="返回主页"><i class="fas fa-home"></i></a>
  <button class="icon-button" id="toggleDarkMode"><i class="fas fa-moon"></i></button>
  <button class="icon-button" id="togglePhotoWall" title="切换到纯图片模式" aria-label="切换到纯图片模式"><i class="fas fa-image"></i></button>
  <button class="icon-button" id="toggleCoverOrientation" title="切换到横版封面" aria-label="切换到横版封面">
    <svg class="cover-orientation-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M16.48 2.52C19.75 4.07 22.09 7.24 22.49 11H24C23.48 5.32 18.68.54 13 0v1.5c1.25.13 2.43.48 3.48 1.02Zm-5.27 1.65a1 1 0 0 0-1.42 0l-5.62 5.62a1 1 0 0 0 0 1.42l8.62 8.62a1 1 0 0 0 1.42 0l5.62-5.62a1 1 0 0 0 0-1.42l-8.62-8.62Zm2.29 13.54L6.29 10.5l4.21-4.21 7.21 7.21-4.21 4.21ZM7.52 21.48C4.25 19.93 1.91 16.76 1.51 13H0c.52 5.68 5.32 10.46 11 11v-1.5a10.4 10.4 0 0 1-3.48-1.02Z"></path>
    </svg>
  </button>
  <button class="icon-button" id="sortToggle" title="排序" aria-label="排序"><i class="fas fa-list"></i></button>
  <div class="sort-menu" id="sortMenu">
    <button id="sortByName"><i class="fas fa-font"></i></button>
    <button id="sortByRating"><i class="fas fa-star"></i></button>
    <button id="sortByDate"><i class="fas fa-calendar-alt"></i></button>
  </div>
</div>

<div class="game-grid" id="gameGrid"></div>

<div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-label="游戏详情" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭游戏详情">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
<script src="search.js"></script>
</body>
</html>
